name: Generate API Documentation

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.84.0

      - name: Generate Rust docs
        run: cargo doc -p share-price-math --no-deps
